name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Tag Version (e.g. 1.2.3). Leave empty to auto-determine based on conventional commits.
        required: false
        default: ''

jobs:
  tag-changelog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ssh-key: ${{ secrets.SSH_KEY }}
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM Packages
      uses: ./.github/actions/setup-npm

    - name: Create Release Tag
      shell: bash
      env:
        RELEASE_TAG_INPUT: ${{ inputs.tag }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        GIT_USER_EMAIL: ${{ secrets.RELEASE_USER_EMAIL }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_REF" != refs/heads/* ]]; then
          printf '%s\n' '::error::This workflow must be run on a branch, not a tag.' >&2
          exit 1
        fi
        : "${GPG_PRIVATE_KEY:?RELEASE_GPG_PRIVATE_KEY is required}"
        : "${GIT_USER_EMAIL:?RELEASE_USER_EMAIL is required}"

        umask 077
        GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/release-tag-gpg.XXXXXX")"
        export GNUPGHOME
        cleanup() {
          gpgconf --kill gpg-agent || true
          rm -rf -- "$GNUPGHOME"
        }
        trap cleanup EXIT

        printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
        unset GPG_PRIVATE_KEY
        signing_key="$(gpg --batch --with-colons --fingerprint --list-secret-keys | awk -F: '$1 == "fpr" && !key { key = $10 } END { print key }')"
        : "${signing_key:?No GPG secret key was imported}"

        cat > "$GNUPGHOME/gpg-wrapper" <<'EOF'
        #!/usr/bin/env bash
        set -euo pipefail
        exec gpg --batch --pinentry-mode loopback --passphrase-fd 3 "$@" 3<<<"${GPG_PASSPHRASE:-}"
        EOF
        chmod 700 "$GNUPGHOME/gpg-wrapper"
        git config --local gpg.format openpgp
        git config --local gpg.program "$GNUPGHOME/gpg-wrapper"
        git config --local user.signingkey "$signing_key"

        args=(
          "--base-branch=$GITHUB_REF_NAME"
          "--github-repository=$GITHUB_REPOSITORY"
          "--git-user-email=$GIT_USER_EMAIL"
          --auto-merge-pr
          --delete-merged-branch
          --sign-commit
        )
        if [[ -n "$RELEASE_TAG_INPUT" ]]; then
          args+=("--tag=$RELEASE_TAG_INPUT")
        fi
        pnpm release-tag -- "${args[@]}"
