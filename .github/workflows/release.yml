name: Release

on:
  push:
    tags:
    - v*.*.*

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Setup NPM Packages
      uses: ./.github/actions/setup-npm

    - name: Build
      run: |
        pnpm build
        pnpm build-artifact -- --version "${GITHUB_REF_NAME#v}"

    - name: Verify Docker Compose
      run: docker compose version

    - name: Verify Compose Sandbox With Real Docker
      env:
        COMPOSE_SANDBOX_REQUIRE_DOCKER: '1'
      run: pnpm --filter @repo-toolkit/compose-sandbox test

    - name: Verify Build Artifact
      run: pnpm verify-artifact -- --version "${GITHUB_REF_NAME#v}"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: repo-toolkit-${{ github.ref_name }}
        path: dist/*.tar.gz

    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        generate_release_notes: true
        files: dist/*.tar.gz
