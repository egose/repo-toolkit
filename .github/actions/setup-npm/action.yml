name: Setup NPM Packages
description: Setup required NPM packages with caching for pnpm
runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/pnpm-packages@ea10b34d7e00b9c23b5699d39993b53c17141dea
    with:
      frozen: 'true'
      ignore-scripts: 'true'
      paths: |
        .
        website
